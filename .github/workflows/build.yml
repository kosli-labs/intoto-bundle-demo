# Build a container image, attest it with actions/attest, save the attestation
# bundles as files, and record them in Kosli from those files.
#
# The `build` job signs the attestations. The `record` job has none of the
# build's permissions and never talks to the registry: all it has is the bundle
# files and the image's digest. `kosli attest in-toto` verifies each bundle's
# signature against the signer pinned below before recording it.

name: Build, attest and record in Kosli

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # A pull request from a fork gets a read-only token, which can neither push
    # the image nor sign an attestation.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push the image to ghcr.io
      id-token: write      # actions/attest signs as this workflow
      attestations: write  # actions/attest stores the attestations with GitHub
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      kosli-configured: ${{ steps.kosli.outputs.configured }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # The attestations in this demo come from actions/attest, not buildx.
          provenance: false
          sbom: false

      - name: Attest the image's provenance
        id: provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Generate an SBOM for the image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the image's SBOM
        id: sbom
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json

      - name: Save the attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          mkdir bundles
          cp "${PROVENANCE_BUNDLE}" bundles/provenance.sigstore.json
          cp "${SBOM_BUNDLE}" bundles/sbom.sigstore.json

      - uses: actions/upload-artifact@v7
        with:
          name: attestation-bundles
          path: bundles/
          if-no-files-found: error

      - name: Summarise what was attested
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Attested \`${IMAGE}@${DIGEST}\`"
            echo
            echo "| Attestation | Predicate type | Rekor transparency log entry |"
            echo "| --- | --- | --- |"
            for kind in provenance sbom; do
              jq -r --arg kind "${kind}" '
                (.dsseEnvelope.payload | @base64d | fromjson | .predicateType) as $type
                | .verificationMaterial.tlogEntries[0].logIndex as $index
                | "| \($kind) | `\($type)` | [\($index)](https://search.sigstore.dev/?logIndex=\($index)) |"
              ' "bundles/${kind}.sigstore.json"
            done
            echo
            echo "The bundle files are in the \`attestation-bundles\` artifact of this run."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check whether Kosli is configured
        id: kosli
        env:
          KOSLI_API_TOKEN: ${{ secrets.KOSLI_API_TOKEN }}
          KOSLI_ORG: ${{ vars.KOSLI_ORG }}
        run: |
          if [ -n "${KOSLI_API_TOKEN}" ] && [ -n "${KOSLI_ORG}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Nothing is recorded in Kosli until the KOSLI_API_TOKEN secret and the KOSLI_ORG variable are both set."
          fi

  record:
    name: Record in Kosli from the bundle files
    needs: build
    if: needs.build.outputs.kosli-configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KOSLI_API_TOKEN: ${{ secrets.KOSLI_API_TOKEN }}
      KOSLI_ORG: ${{ vars.KOSLI_ORG }}
      KOSLI_FLOW: intoto-bundle-demo
      KOSLI_TRAIL: ${{ github.sha }}
      # Looks up the message, author and time of the commit the provenance names.
      KOSLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIGEST: ${{ needs.build.outputs.digest }}
      # The signer every bundle must have: a workflow in this repository.
      SIGNER_IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/
      SIGNER_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: attestation-bundles
          path: bundles

      - uses: kosli-dev/setup-cli-action@v5
        with:
          version: 2.56.0

      - name: Create the Kosli flow
        run: |
          kosli create flow "${KOSLI_FLOW}" \
            --description "An image attested with actions/attest and recorded from its bundle files" \
            --template-file kosli-flow.yml

      - name: Begin the Kosli trail
        run: kosli begin trail "${KOSLI_TRAIL}"

      # The commit, branch, repository and build URL recorded are the ones the
      # provenance states, not this job's.
      - name: Record the provenance bundle, as the artifact named image
        run: |
          kosli attest in-toto \
            --fingerprint "${DIGEST#sha256:}" \
            --bundle bundles/provenance.sigstore.json \
            --predicate-type provenance \
            --name image \
            --certificate-identity-regexp "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "${SIGNER_ISSUER}"

      - name: Record the SBOM bundle, as image.sbom
        run: |
          kosli attest in-toto \
            --fingerprint "${DIGEST#sha256:}" \
            --bundle bundles/sbom.sigstore.json \
            --predicate-type sbom \
            --name image.sbom \
            --certificate-identity-regexp "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "${SIGNER_ISSUER}"
